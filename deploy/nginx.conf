# shiguang-relay 源站反代（nginx 在源站终结 TLS，使用自有证书）
#
# 用法：
#   1) 把本文件放到源站 /etc/nginx/conf.d/relay.conf（或 sites-enabled）
#   2) 把 server_name 改成你的域名；确认 ssl_certificate / ssl_certificate_key 路径正确
#   3) 证书文件权限：private.key 建议 600、属主 root，nginx（master 为 root）可读
#   4) nginx -t && systemctl reload nginx
#
# 说明：
#   - nginx 监听 443 终结 TLS（使用 /etc/nginx/ssl/ 下的自有证书），80 仅做跳转 + ACME 校验。
#   - relay 容器只暴露 127.0.0.1:8080，外部不可直连，全部经本反代进入。
#   - CF-Connecting-IP / X-Forwarded-For / X-Forwarded-Proto 透传，供 relay 取真实客户端 IP。
#
# Cloudflare 配合（二选一）：
#   A) 证书是「公共可信证书」（Let's Encrypt / 付费 DV）—— 可灰云直连，绕过橙云的 ~100s WSS 空闲超时；
#   B) 证书是「Cloudflare Origin CA 证书」—— 必须橙云 + SSL 模式 Full(strict)（该证书仅 CF 信任）。

# HTTP：ACME 校验（若用 certbot webroot 续期）+ 全站跳转 HTTPS
server {
    listen 80;
    server_name relay.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：终结 TLS 并反代到 relay
server {
    listen 443 ssl;
    server_name relay.example.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # §10.4 单包上限 256KB，与服务端 decode 限长双保险
    client_max_body_size 256k;

    # WSS：纯路径建连 + Upgrade 头透传（首帧 AUTH 由 relay 3s 掐线把关）
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;          # 实时双向流，关闭代理缓冲避免延迟
        proxy_read_timeout 3600s;     # 放宽；真正的上限取决于 Cloudflare（灰云则无此限制）
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
