# shiguang-relay · 本地联调底座
# 本机用 podman-compose（docker-compose v1 协议）：
#   podman-compose up -d               起 PG + Redis
#   podman-compose --profile app up -d 起全栈（Phase 1 落地 cmd/relayd 后）
# 若换 docker compose：COMPOSE="docker compose" 传给 scripts/*.sh 即可。
services:
  postgres:
    image: postgres:16-alpine
    container_name: shiguang-relay-pg
    environment:
      POSTGRES_USER: ${PG_USER:-relay}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-relay}
      POSTGRES_DB: ${PG_DB:-relay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 契约 DDL 首次建库：docker compose exec -T postgres psql -U relay -d relay \
      #   -v ON_ERROR_STOP=1 -f - < migrations/0001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-relay} -d ${PG_DB:-relay}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: shiguang-relay-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # client_msg_id 幂等去重（SETEX 300）+ WSS 会话态；不做持久化，重启即空可接受
      - "6379:6379"

  relay:
    profiles: ["app"]          # Phase 1 起用：docker compose --profile app up -d
    image: ${RELAY_IMAGE:-ghcr.io/loveheng/shiguang-relay:latest}
    container_name: shiguang-relay-app
    environment:
      RELAY_PG_DSN: "host=postgres port=5432 dbname=${PG_DB:-relay} user=${PG_USER:-relay} password='${PG_PASSWORD:-relay}' sslmode=disable"
      RELAY_REDIS_ADDR: "${RELAY_REDIS_ADDR:-redis:6379}"
      RELAY_LISTEN: "${RELAY_LISTEN:-:8080}"
      RELAY_JWT_SECRET: "${RELAY_JWT_SECRET:?RELAY_JWT_SECRET required (>=32 bytes)}"
      RELAY_POW_DIFFICULTY: "${RELAY_POW_DIFFICULTY:-4}"
      RELAY_REGISTER_LIMIT_PER_MIN: "${RELAY_REGISTER_LIMIT_PER_MIN:-3}"
      RELAY_FRIEND_INVITE_LIMIT_PER_MIN: "${RELAY_FRIEND_INVITE_LIMIT_PER_MIN:-10}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
