# shiguang-relay 生产档（Phase 1.7，nginx + Cloudflare 橙云版）
# 用法：
#   cp .env.example .env   # 至少设置 RELAY_JWT_SECRET（≥32 字节）与 PG_PASSWORD
#   生产起服：podman-compose -f docker-compose.prod.yml up -d
#
# TLS 由 Cloudflare 橙云（代理）在边缘终结并签发证书；源站只跑一个 nginx 做
# HTTP 反代到 relay:8080（见 deploy/nginx.conf）。因此本 compose 不再含 Caddy，
# relay 只对本机回环暴露（127.0.0.1:8080），外部不可直连。
#
# 底线（fact §7.1-3）：单机 VPS 炸了要能 10 分钟内拉起新主机一键还原 —— 备份 sidecar
# 稳定后建议启用（见下方 backup 服务，默认关闭，--profile backup 启用）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: relay-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-relay}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required}
      POSTGRES_DB: ${PG_DB:-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-relay} -d ${PG_DB:-relay}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 端口不对宿主暴露：只走 compose 内网

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # 只存 nonce / 幂等键 / WSS 会话态，重启即空可接受（非持久事实源）

  relay:
    image: ${RELAY_IMAGE:-ghcr.io/loveheng/shiguang-relay:latest}
    container_name: relay-app
    restart: unless-stopped
    # 只对本机回环暴露：外部经 Cloudflare → 源站 nginx → 127.0.0.1:8080 进入，relay 不直连外网
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RELAY_LISTEN: ":8080"
      RELAY_PG_DSN: "host=postgres port=5432 dbname=${PG_DB:-relay} user=${PG_USER:-relay} password='${PG_PASSWORD:?PG_PASSWORD required}' sslmode=disable"
      RELAY_REDIS_ADDR: "redis:6379"
      RELAY_JWT_SECRET: "${RELAY_JWT_SECRET:?RELAY_JWT_SECRET required (>=32 bytes)}"
      RELAY_POW_DIFFICULTY: "${RELAY_POW_DIFFICULTY:-4}"
      RELAY_REGISTER_LIMIT_PER_MIN: "${RELAY_REGISTER_LIMIT_PER_MIN:-3}"
      RELAY_FRIEND_INVITE_LIMIT_PER_MIN: "${RELAY_FRIEND_INVITE_LIMIT_PER_MIN:-10}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 灾备：每小时 pg_dump | gzip 落本地卷；配了 RCLONE_REMOTE 则同步到异地（R2/S3）
  # 默认不启动（服务尚不稳定）；稳定后启用：compose ... --profile backup up -d
  backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    container_name: relay-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 * * * * /backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        exec crond -f -l 2
    environment:
      PG_USER: ${PG_USER:-relay}
      PG_PASSWORD: "${PG_PASSWORD:?PG_PASSWORD required}"
      PG_DB: ${PG_DB:-relay}
      PGHOST: postgres
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  backups:
